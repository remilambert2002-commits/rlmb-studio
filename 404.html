<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — RLMB Studio</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#FF4D00" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23080808'/><text y='78' x='8' font-size='72' font-family='Arial Black' fill='%23FF4D00' font-weight='900'>R</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #FF4D00;
      --black: #080808;
      --gray1: #141414;
      --white: #F2EDE6;
      --muted: #8a8a8a;
      --border: #222222;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    .bg-num {
      position: absolute;
      font-family: 'Bungee Shade', 'Bungee', sans-serif;
      font-size: clamp(14rem, 45vw, 32rem);
      color: rgba(255,77,0,0.05);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      user-select: none;
      line-height: 1;
      z-index: 0;
    }
    .content { position: relative; z-index: 1; max-width: 480px; }
    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--orange);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Bungee', sans-serif;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 0.95;
      margin: 0 0 1.5rem;
    }
    h1 span { color: var(--orange); }
    p {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 2.5rem;
    }
    .btn-primary {
      display: inline-block;
      background: var(--orange); color: var(--black);
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.9rem 2rem;
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .links { margin-top: 2rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
    .links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .links a:hover { color: var(--orange); }
  </style>
</head>
<body>
  <div class="bg-num" aria-hidden="true">404</div>
  <div class="content">
    <div class="eyebrow">Erreur 404</div>
    <h1>CETTE PAGE<br>N'EXISTE <span>PAS.</span></h1>
    <p>Soit le lien est cassé, soit tu as tapé une adresse au hasard pour voir. Dans les deux cas, ce que tu cherches n'est pas ici — mais le reste du studio l'est.</p>
    <a href="/" class="btn-primary">Retour au site →</a>
    <div class="links">
      <a href="/#work">Travaux</a>
      <a href="/#offer">Offre</a>
      <a href="/#contact">Contact</a>
    </div>
  </div>
</body>
</html>
