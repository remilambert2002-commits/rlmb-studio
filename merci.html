<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message envoyé — RLMB Studio</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#FF4D00" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23080808'/><text y='78' x='8' font-size='72' font-family='Arial Black' fill='%23FF4D00' font-weight='900'>R</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #FF4D00;
      --black: #080808;
      --gray1: #141414;
      --white: #F2EDE6;
      --muted: #8a8a8a;
      --border: #222222;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .check {
      width: 56px; height: 56px;
      border: 1px solid var(--orange);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--orange);
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }
    .content { max-width: 480px; }
    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--orange);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'Bungee', sans-serif;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 0.98;
      margin: 0 0 1.5rem;
    }
    p {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 1rem;
    }
    .promise {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--white);
      border: 1px solid var(--border);
      display: inline-block;
      padding: 0.7rem 1.2rem;
      margin: 1.5rem 0 2.5rem;
      letter-spacing: 0.05em;
    }
    .promise span { color: var(--orange); }
    .btn-primary {
      display: inline-block;
      background: var(--orange); color: var(--black);
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem; letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.9rem 2rem;
      text-decoration: none;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .social-links { margin-top: 2rem; display: flex; gap: 0.8rem; justify-content: center; }
    .social-link {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .social-link:hover { border-color: var(--orange); color: var(--orange); }
  </style>
</head>
<body>
  <div class="content">
    <div class="check">✓</div>
    <div class="eyebrow">Message envoyé</div>
    <h1>C'EST BIEN<br>PARTI.</h1>
    <p>Ton message vient d'atterrir dans la boîte de RLMB Studio. On le lit, on y réfléchit, et on revient vers toi avec quelque chose d'utile — pas un accusé de réception automatique.</p>
    <div class="promise">Réponse sous <span>24h</span></div>
    <div>
      <a href="/" class="btn-primary">Retour au site →</a>
    </div>
    <div class="social-links">
      <a href="https://instagram.com/rlmb_studio" target="_blank" rel="noopener noreferrer" class="social-link" title="Instagram">IG</a>
      <a href="https://linkedin.com/company/rlmb-studio" target="_blank" rel="noopener noreferrer" class="social-link" title="LinkedIn">LI</a>
      <a href="mailto:rlmbstudio@gmail.com" class="social-link" title="Email">@</a>
    </div>
  </div>
</body>
</html>
